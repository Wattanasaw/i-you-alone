name: คัดรูปปกที่เที่ยว + ให้คะแนนรูปงานด้วย AI

# กดรันเองได้จากแท็บ Actions เมื่ออยากให้ AI คัดรูปเพิ่ม (รอบรายวันก็คัดให้อยู่แล้ว)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "จำนวนสถานที่ที่หารูปรอบนี้"
        default: "200"
      ai:
        description: "คำขอ AI สูงสุดรอบนี้ (โควต้าฟรี GitHub Models ~150/วัน)"
        default: "45"

permissions:
  contents: write
  models: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ใช้ข้อมูลล่าสุดบน main ตอนเริ่มรัน (ไม่ใช่ตอนกดสั่ง) — รอบที่รอคิวจะไม่เขียนทับผลของรอบก่อน
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ติดตั้งตัวย่อรูป (sharp) ไว้ย่อรูปก่อนส่งให้ AI
        run: mkdir -p .tools && cd .tools && echo '{"name":"tools","private":true}' > package.json && npm install --no-audit --no-fund sharp@0.33.5 >/dev/null
        continue-on-error: true
      - name: โพสต์เทรนด์ที่พูดถึงแต่ละสถานที่ (คลัง Lemon8 77 จังหวัด)
        run: node scripts/place-posts.mjs
        continue-on-error: true
      - name: รวบรวมสถานที่จากโพสต์เทรนด์ (AI หาชื่อ + หาพิกัดจริงบนแผนที่ OSM)
        run: node scripts/trend-places.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: เขต/อำเภอของแต่ละสถานที่ (จากพิกัด · OpenStreetMap)
        run: node scripts/place-districts.mjs
        continue-on-error: true
      - name: AI สรุปรีวิวแต่ละสถานที่จากโพสต์จริง (จุดเด่น ต้องลอง เคล็ดลับ เหมาะกับ)
        run: node scripts/place-reviews.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: หารูปปก + ให้ AI ดูรูปจริง เลือกรูปที่ตรงและน่าดู
        run: node scripts/place-images.mjs --limit "${{ inputs.limit }}" --ai "${{ inputs.ai }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ค่าเข้า + ราคาเมนู จากรีวิว Lemon8 (AI ดึงเฉพาะราคาที่ระบุชัด)
        run: node scripts/place-prices.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ให้ AI ให้คะแนนรูปปกงาน
        run: node scripts/event-images.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ตรวจข้อมูล
        run: node scripts/check-data.mjs
      - name: บันทึก
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/places.json data/trend-places.json data/trend-extract.json data/place-reviews.json data/place-districts.json data/place-images.json data/place-prices.json data/auto-events.json data/event-images.json
          git diff --cached --quiet || (git commit -m "AI คัดรูปปกที่เที่ยว" && git pull --rebase -X theirs && git push)
