name: คัดรูปปกที่เที่ยวด้วย AI

# กดรันเองได้จากแท็บ Actions เมื่ออยากให้ AI คัดรูปเพิ่ม (รอบรายวันก็คัดให้อยู่แล้ว)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "จำนวนสถานที่ที่หารูปรอบนี้"
        default: "200"
      ai:
        description: "คำขอ AI สูงสุดรอบนี้ (โควต้าฟรี GitHub Models ~150/วัน)"
        default: "45"

permissions:
  contents: write
  models: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: หารูปปก + ให้ AI ดูรูปจริง เลือกรูปที่ตรงและน่าดู
        run: node scripts/place-images.mjs --limit "${{ inputs.limit }}" --ai "${{ inputs.ai }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ตรวจข้อมูล
        run: node scripts/check-data.mjs
      - name: บันทึก
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/places.json data/place-images.json
          git diff --cached --quiet || (git commit -m "AI คัดรูปปกที่เที่ยว" && git pull --rebase -X theirs && git push)
