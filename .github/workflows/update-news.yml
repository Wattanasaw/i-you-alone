name: อัปเดตข่าวและงานอีเว้นท์อัตโนมัติ

on:
  schedule:
    - cron: "0 23 * * *"   # วันละครั้ง เวลา 06:00 น. เวลาไทย
  workflow_dispatch: {}     # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write
  models: read      # ใช้ GitHub Models (AI ฟรี) สำรองเมื่อ Gemini โควต้าหมด

# ไม่ให้รันพร้อมกับงานคัดรูป (แก้ไฟล์เดียวกัน)
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # เหลือเวลาให้ขั้นบันทึกก่อนเพดาน 6 ชม. ของ GitHub
    steps:
      - uses: actions/checkout@v5
        with:
          # ใช้ข้อมูลล่าสุดบน main ตอนเริ่มรัน (ไม่ใช่ตอนกดสั่ง) — รอบที่รอคิวจะไม่เขียนทับผลของรอบก่อน
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ติดตั้งตัวย่อรูป (sharp) ไว้ย่อรูปก่อนส่งให้ AI
        run: mkdir -p .tools && cd .tools && echo '{"name":"tools","private":true}' > package.json && npm install --no-audit --no-fund sharp@0.33.5 >/dev/null
        continue-on-error: true
      - name: ดึงข่าว
        run: node scripts/update-news.mjs
        timeout-minutes: 15   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: ดึงงานจริงจากเว็บขายบัตร (Eventpop, Zipevent) + กรองอัตโนมัติ
        run: node scripts/fetch-events.mjs
        timeout-minutes: 15   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true   # เว็บต้นทางล่ม/เปลี่ยนหน้าตา ข่าวยังอัปเดตได้ตามปกติ
      - name: รวบรวมที่เที่ยวดัง + ข่าวเทรนด์ (Wikidata, Wikipedia, OpenStreetMap, Google News)
        run: node scripts/fetch-places.mjs
        timeout-minutes: 40   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: โพสต์เทรนด์ที่พูดถึงแต่ละสถานที่ (คลัง Lemon8 77 จังหวัด)
        run: node scripts/place-posts.mjs
        timeout-minutes: 28   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: รวบรวมสถานที่จากโพสต์เทรนด์ (AI หาชื่อ + หาพิกัดจริงบนแผนที่ OSM)
        run: node scripts/trend-places.mjs
        timeout-minutes: 30   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: รีวิว Lemon8 ของแต่ละสถานที่ (ค้นด้วยชื่อสถานที่ เก็บสูงสุด 24 โพสต์/แห่ง)
        run: node scripts/place-lemon8.mjs
        timeout-minutes: 28   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: รูปโพสต์เทรนด์ยอดนิยมของแต่ละสถานที่ (Lemon8 · ต่ออายุลิงก์รูปก่อนหมด)
        run: node scripts/post-images.mjs
        timeout-minutes: 10   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: เขต/อำเภอของแต่ละสถานที่ (จากพิกัด · OpenStreetMap)
        run: node scripts/place-districts.mjs
        timeout-minutes: 12   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: AI สรุปรีวิวแต่ละสถานที่จากโพสต์จริง (จุดเด่น ต้องลอง เคล็ดลับ เหมาะกับ)
        run: node scripts/place-reviews.mjs
        timeout-minutes: 25   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: นำเข้าข้อมูลสถานที่ที่รวบรวมด้วย Gemini (ไฟล์คำตอบใน gemini/answers/)
        run: node scripts/import-gemini.mjs
        timeout-minutes: 5   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: เลือกรูปปกที่เที่ยวที่น่าดู (Wikimedia Commons + AI ดูรูปจริง)
        run: node scripts/place-images.mjs
        timeout-minutes: 25   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ค่าเข้า + ราคาเมนู จากรีวิว Lemon8 (AI ดึงเฉพาะราคาที่ระบุชัด)
        run: node scripts/place-prices.mjs
        timeout-minutes: 20   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: เวลาเปิด-ปิด + ค่าเข้า + ราคาเมนู ให้ครบ (เว็บไซต์ทางการ · รีวิว · AI · ค่าทั่วไปตามประเภท)
        run: node scripts/place-info.mjs --ai 60
        timeout-minutes: 20   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ราคาน้ำมันวันนี้ (บางจาก) ใช้คำนวณค่าเดินทาง
        run: node scripts/fuel-price.mjs
        timeout-minutes: 3   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: ข้อมูลจุดเดินทาง (รถไฟฟ้า ท่าเรือ สถานีรถไฟ บขส. สนามบิน) — อัปเดตสัปดาห์ละครั้ง
        run: node scripts/fetch-transit.mjs
        timeout-minutes: 10   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: ให้ AI ตรวจงาน คัดงานไม่เหมาะ แก้หมวด หาสปอนเซอร์ แปล 3 ภาษา (Gemini หรือ GitHub Models)
        run: node scripts/ai-review.mjs
        timeout-minutes: 25   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: รายละเอียดอีเว้นท์ (AI อ่านหน้าอีเว้นท์ สรุปว่าคืออะไร ใครมาบ้าง ไฮไลต์ + แยกหมวด)
        run: node scripts/event-details.mjs
        timeout-minutes: 20   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ให้ AI ดูรูปปกงาน ให้คะแนนความน่ากด (โปสเตอร์ตัวหนังสือล้วนไม่ขึ้นห้ามพลาด)
        run: node scripts/event-images.mjs
        timeout-minutes: 15   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ลิงก์รูปย่อของโพสต์ Lemon8 (รูปเต็ม 1 MB → ย่อผ่าน wsrv.nl ให้โหลดเร็วบนมือถือ)
        run: node scripts/thumbs.mjs
        timeout-minutes: 10   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
      - name: ตรวจข้อมูล
        id: check
        run: node scripts/check-data.mjs
        timeout-minutes: 5   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
      - name: แปลงานใหม่เป็นอังกฤษ/จีน (Gemini หรือ GitHub Models)
        run: node scripts/translate.mjs
        timeout-minutes: 15   # เพดานเวลา (กันทั้งรอบเกิน 6 ชม. แล้วโดนตัดก่อนบันทึก)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: บันทึกการเปลี่ยนแปลง
        # บันทึกเสมอ แม้ขั้นก่อนหน้าหมดเวลา/ทั้งรอบเกินเวลา (ยกเว้นตรวจข้อมูลไม่ผ่าน)
        if: ${{ always() && steps.check.outcome != 'failure' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          # เพิ่มทีละไฟล์ (ถ้าไฟล์ไหนไม่มี git add ทั้งบรรทัดจะล้ม แล้วไฟล์อื่นไม่ถูกบันทึก)
          for f in data/news.json data/events.json data/venues.json data/auto-events.json data/geocache.json data/ai-cache.json data/event-details.json data/places.json data/trend-places.json data/trend-extract.json data/place-reviews.json data/place-ai.json gemini/answers data/place-districts.json data/transit.json data/place-images.json data/event-images.json data/place-prices.json data/place-info.json data/post-images.json data/thumb-cache.json data/thumbs data/fuel.json data/place-posts; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "อัปเดตข่าวอีเว้นท์อัตโนมัติ" && git pull --rebase -X theirs && git push)
