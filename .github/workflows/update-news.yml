name: อัปเดตข่าวอีเว้นท์อัตโนมัติ

on:
  schedule:
    - cron: "0 23 * * *"   # ทุกวันเวลา 06:00 น. เวลาไทย
    - cron: "0 11 * * *"   # ทุกวันเวลา 18:00 น. เวลาไทย
  workflow_dispatch: {}     # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ดึงข่าว
        run: node scripts/update-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: แปลงานใหม่เป็นอังกฤษ/จีน (ทำงานเมื่อมี GEMINI_API_KEY)
        run: node scripts/translate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: บันทึกการเปลี่ยนแปลง
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json data/events.json data/venues.json
          git diff --cached --quiet || (git commit -m "อัปเดตข่าวอีเว้นท์อัตโนมัติ" && git pull --rebase && git push)
