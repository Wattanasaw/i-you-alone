name: อัปเดตข่าวและงานอีเว้นท์อัตโนมัติ

on:
  schedule:
    - cron: "0 23 * * *"   # วันละครั้ง เวลา 06:00 น. เวลาไทย
  workflow_dispatch: {}     # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write
  models: read      # ใช้ GitHub Models (AI ฟรี) สำรองเมื่อ Gemini โควต้าหมด

# ไม่ให้รันพร้อมกับงานคัดรูป (แก้ไฟล์เดียวกัน)
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ติดตั้งตัวย่อรูป (sharp) ไว้ย่อรูปก่อนส่งให้ AI
        run: mkdir -p .tools && cd .tools && npm init -y >/dev/null && npm install --no-audit --no-fund sharp@0.33.5 >/dev/null
        continue-on-error: true
      - name: ดึงข่าว
        run: node scripts/update-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: ดึงงานจริงจากเว็บขายบัตร (Eventpop, Zipevent) + กรองอัตโนมัติ
        run: node scripts/fetch-events.mjs
        continue-on-error: true   # เว็บต้นทางล่ม/เปลี่ยนหน้าตา ข่าวยังอัปเดตได้ตามปกติ
      - name: รวบรวมที่เที่ยวดัง + ข่าวเทรนด์ (Wikidata, Wikipedia, OpenStreetMap, Google News)
        run: node scripts/fetch-places.mjs
        continue-on-error: true
      - name: โพสต์เทรนด์ที่พูดถึงแต่ละสถานที่ (คลัง Lemon8 77 จังหวัด)
        run: node scripts/place-posts.mjs
        continue-on-error: true
      - name: เลือกรูปปกที่เที่ยวที่น่าดู (Wikimedia Commons + AI ดูรูปจริง)
        run: node scripts/place-images.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ค่าเข้า + ราคาเมนู จากรีวิว Lemon8 (AI ดึงเฉพาะราคาที่ระบุชัด)
        run: node scripts/place-prices.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ข้อมูลจุดเดินทาง (รถไฟฟ้า ท่าเรือ สถานีรถไฟ บขส. สนามบิน) — อัปเดตสัปดาห์ละครั้ง
        run: node scripts/fetch-transit.mjs
        continue-on-error: true
      - name: ให้ AI ตรวจงาน คัดงานไม่เหมาะ แก้หมวด หาสปอนเซอร์ แปล 3 ภาษา (Gemini หรือ GitHub Models)
        run: node scripts/ai-review.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ให้ AI ดูรูปปกงาน ให้คะแนนความน่ากด (โปสเตอร์ตัวหนังสือล้วนไม่ขึ้นห้ามพลาด)
        run: node scripts/event-images.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ตรวจข้อมูล
        run: node scripts/check-data.mjs
      - name: แปลงานใหม่เป็นอังกฤษ/จีน (Gemini หรือ GitHub Models)
        run: node scripts/translate.mjs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: บันทึกการเปลี่ยนแปลง
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json data/events.json data/venues.json data/auto-events.json data/geocache.json
          git add data/ai-cache.json data/places.json data/transit.json data/place-images.json data/event-images.json data/place-prices.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "อัปเดตข่าวอีเว้นท์อัตโนมัติ" && git pull --rebase -X theirs && git push)
